name: Backend

# Vérifie le backend Laravel à chaque push et pull request qui le concerne :
# style (Pint), analyse statique (Larastan) et tests (Pest) sur PostgreSQL.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Style, analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wariss_dev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, gd, zip, bcmath, fileinfo
          coverage: none
          tools: composer:v2

      - name: Mettre en cache les dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (Pest)
        run: php artisan test

      # Scramble lit le schéma des tables pour typer les modèles : il lui faut une base migrée.
      - name: Contrat OpenAPI à jour (openapi.json)
        env:
          DB_DATABASE: wariss_dev_test
        run: |
          php artisan migrate --force --no-interaction
          php artisan scramble:export
          git diff --exit-code -- openapi.json || { echo "::error::openapi.json n'est plus à jour : lancez « php artisan scramble:export » et committez le fichier."; exit 1; }
